<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoldBot · 叠衣分拣机器人</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="scene"></canvas></div>
  <aside id="panel">
    <h1>FoldBot <span>叠衣分拣机器人</span></h1>
    <p class="sub">ABC 叠衣法 · 关键点检测 · 按家人分拣</p>
    <div id="steps"></div>
    <div id="status">选择衣服种类，点击「播放」开始</div>
    <div id="kindpicker">
      <button data-kind="random" class="on">🎲 随机</button>
      <button data-kind="tee">T恤</button>
      <button data-kind="tee-long">长袖T恤</button>
      <button data-kind="pants-long">长裤</button>
      <button data-kind="pants-short">短裤</button>
    </div>
    <div id="controls">
      <button id="btnPlay" class="primary">▶ 播放</button>
      <button id="btnAgain">再叠一件</button>
      <button id="btnSort">🔁 连续分拣</button>
      <div id="speed">
        <button data-speed="0.5">0.5×</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
      </div>
    </div>
    <div id="bins"></div>
    <div id="binmode" style="margin:8px 0;font-size:13px;">
      <button id="btnBinAuto" class="on">🔍 自动识别人数</button>
      <button id="btnBinFixed">👪 固定四人</button>
    </div>
    <div id="eyepanel">
      <div class="eyelabel">机器人视角 · 种类识别 + 关键点检测</div>
      <canvas id="inset" width="320" height="320"></canvas>
    </div>
    <p class="note">机械臂从对面的待洗篮取一件衣服到中间，俯视相机识别种类、检测关键点，量肩宽/腰宽。<b>自动模式</b>下按衣服尺寸聚类推断有几个人，衣箱动态生成；也可以切换<b>固定四人</b>（爸爸/妈妈/女儿/儿子）。叠好后放入臂后方对应的衣箱。「连续分拣」会一件接一件自动处理。</p>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
