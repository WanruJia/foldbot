<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Fold Capture</title>
<style>body{margin:0;background:#fff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buildGarmentMesh } from './garments.js';
import { planFolds } from './planner.js';
import { foldPointVert, sideOfLine } from './fold.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(800, 800);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 1.4, 0.001); // 俯视，近一点
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(0.5, 3, 0.5); key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.8);
fill.position.set(-1, 2, -1);
scene.add(fill);

// 地面（柔和阴影）
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 4),
  new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true;
scene.add(ground);
scene.background = new THREE.Color(0x3a3a3a);

// 建一件妈妈的 T 恤（保留原始贴图纹理）
const g = buildGarmentMesh('tee', 'mom');
g.mesh.castShadow = true;
// 把旋转烘焙进几何体：本地坐标 = 世界坐标 (XZ 平面平铺)
g.mesh.geometry.rotateX(-Math.PI / 2);
scene.add(g.mesh);

// 关键点：按 mom 尺寸 (肩宽 0.62)，网格中心在原点 (JS planner 用 camelCase)
const w = 0.62;
const P = (x, z) => ({ x, y: 0.002, z });
const kp = {
  sleeveL: P(-w/2-0.12, 0.05), sleeveR: P(w/2+0.12, 0.05),
  shoulderL: P(-w/2, -0.18), shoulderR: P(w/2, -0.18),
  hemL: P(-w/2+0.02, 0.22), hemR: P(w/2-0.02, 0.22),
  A: P(-w/4, -0.18), B: P(-w/4, 0.02), C: P(-w/4, 0.22),
};
const plan = planFolds(kp);
console.log('folds:', plan.folds.map(f => f.label).join(','));

function applyFold(f) {
  const pos = g.mesh.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const p = f.params;
    if (sideOfLine(p.px, p.pz, p.dx, p.dz, x, z) * p.foldSign > 0) {
      const q = foldPointVert(p.px, p.pz, p.dx, p.dz, p.axisH, p.foldSign, 1, x, y, z);
      pos.setXYZ(i, q.x, q.y, q.z);
    }
  }
  pos.needsUpdate = true;
  g.mesh.geometry.computeVertexNormals();
}

function render(label) {
  renderer.render(scene, camera);
  // 导出
  const url = renderer.domElement.toDataURL('image/png');
  console.log('CAPTURE:' + label + ':' + url.length);
  window['img_' + label] = url;
}

// 依次渲染
render('flat');
for (let i = 0; i < plan.folds.length; i++) {
  applyFold(plan.folds[i]);
  render('fold' + i);
}
console.log('DONE');
</script>
</body></html>
